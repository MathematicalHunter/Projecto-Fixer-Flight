<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - FixerFlight</title>
    <!-- Mantén tu enlace a los estilos -->
    <link rel="stylesheet" href="css/sesion.css">
</head>
<body class="body-login">

    <div class="login-container">
        <div class="login-card">

             <a href="index.html" class="btn-volver">← Volver al inicio</a>
            
            <!-- Logo de FixerFlight  -->
            <div class="login-header">
                <div class="icon-circle">
                    <!-- Icono del avión (puedes usar un SVG aquí) -->
                    <span class="avion-icon">✈</span>
                </div>
                <div class="text-container">
                    <h1 class="main-title">
                        <span class="text-white">Fixer</span><span class="text-cyan">Flight</span>
                    </h1>
                </div>
            </div>

            <h2 class="login-title">Bienvenido de nuevo</h2>
            <p class="login-subtitle">Ingresa tus datos para buscar los mejores vuelos.</p>

            <!-- Formulario -->
            <form action="#" class="login-form">
                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox"> Recordarme
                    </label>
                    <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn-crear btn-full">Iniciar Sesión</button>
            </form>

            <p class="register-link">
                ¿No tienes una cuenta? <a href="crear.html">Crear cuenta</a>
            </p>

        </div>
    </div>

</body>
</html>
