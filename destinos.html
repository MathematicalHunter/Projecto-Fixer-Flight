
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destinos | FixerFlight</title>
    <link rel="stylesheet" href="css/destino.css">
</head>

<body>

    <header class="contenedor">

        <a href="#" class="logo-link">
            <div class="logo">
                <div class="icon-circle">
                    <svg xmlns="http://www.w3.org/2000/svg"
                         viewBox="0 0 24 24"
                         fill="currentColor"
                         class="avion-icon"
                         aria-hidden="true">
                        <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
                    </svg>
                </div>

                <div class="text-container">
                    <h1 class="main-title">
                        <span class="text-white">Fixer</span><span class="text-cyan">Flight</span>
                    </h1>
                    <p class="subtitle">COMPARADOR DE VUELOS</p>
                </div>
            </div>
        </a>

        <nav aria-label="Navegación principal">
            <ul class="nav-menu">
                <li><a href="index.html" data-page="inicio">Inicio</a></li>
                <li><a href="destinos.html" data-page="destinos" class="active" aria-current="page">Destinos</a></li>
                <li><a href="planificador.html" data-page="planificador">Planificador</a></li>
                <li><a href="guardados.html" data-page="guardados">Guardados</a></li>
            </ul>
        </nav>

        <div class="sesion">
            <a href="inicio-sesion.html" class="Inicio_sesion">
                Iniciar sesión
            </a>
            <button type="button" class="btn-crear">
                Crear cuenta
            </button>
        </div>

    </header>

    <main class="destinos">

        <h1>Descubrí el mundo</h1>

        <div class="contenedor-destinos">

            <!-- TOKIO -->
            <article class="tarjeta">
                <img src="img/tokio.jpg" alt="Paisaje de Tokio, Japón">

                <div class="contenido">
                    <h2>Tokio</h2>
                    <p>Japón · Asia</p>

                    <button type="button" onclick="seleccionarDestino(
                        'Tokio',
                        'Japón',
                        'Asia',
                        '14h 30m',
                        '22°C',
                        'Mar - May'
                    )">
                        Seleccionar
                    </button>
                </div>
            </article>

            <!-- PARÍS -->
            <article class="tarjeta">
                <img src="img/paris.jpg" alt="Paisaje de París, Francia">

                <div class="contenido">
                    <h2>París</h2>
                    <p>Francia · Europa</p>

                    <button type="button" onclick="seleccionarDestino(
                        'París',
                        'Francia',
                        'Europa',
                        '11h 15m',
                        '18°C',
                        'Abr - Jun'
                    )">
                        Seleccionar
                    </button>
                </div>
            </article>

            <!-- DUBÁI -->
            <article class="tarjeta">
                <img src="img/dubai.jpg" alt="Edificios de Dubái">

                <div class="contenido">
                    <h2>Dubái</h2>
                    <p>Emiratos Árabes Unidos · Medio Oriente</p>

                    <button type="button" onclick="seleccionarDestino(
                        'Dubái',
                        'Emiratos Árabes Unidos',
                        'Medio Oriente',
                        '14h 05m',
                        '35°C',
                        'Nov - Mar'
                    )">
                        Seleccionar
                    </button>
                </div>
            </article>

            <!-- BALI -->
            <article class="tarjeta">
                <img src="img/Bali.jpg" alt="Paisaje tropical de Bali">

                <div class="contenido">
                    <h2>Bali</h2>
                    <p>Indonesia · Asia</p>

                    <button type="button" onclick="seleccionarDestino(
                        'Bali',
                        'Indonesia',
                        'Asia',
                        '19h 30m',
                        '29°C',
                        'May - Sep'
                    )">
                        Seleccionar
                    </button>
                </div>
            </article>

            <!-- LONDRES -->
            <article class="tarjeta">
                <img src="img/Londres.jpg" alt="Paisaje de Londres, Reino Unido">

                <div class="contenido">
                    <h2>Londres</h2>
                    <p>Reino Unido · Europa</p>

                    <button type="button" onclick="seleccionarDestino(
                        'Londres',
                        'Reino Unido',
                        'Europa',
                        '12h 20m',
                        '16°C',
                        'Jun - Ago'
                    )">
                        Seleccionar
                    </button>
                </div>
            </article>

        </div>

    <script src="js/destinos.js"></script>

</html>
