<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - FixerFlight</title>
    <link rel="stylesheet" href="css/crear.css">
</head>
<body class="body-login">

    <div class="login-container">
        <div class="login-card">

            <a href="index.html" class="btn-volver">← Volver al inicio</a>
            
            <!-- Logo de FixerFlight -->
            <div class="login-header">
                <div class="icon-circle">
                    <span class="avion-icon">✈</span>
                </div>
                <div class="text-container">
                    <h1 class="main-title">
                        <span class="text-white">Fixer</span><span class="text-cyan">Flight</span>
                    </h1>
                </div>
            </div>

            <!-- Títulos cambiados para el registro -->
            <h2 class="login-title">Crea tu cuenta</h2>
            <p class="login-subtitle">Únete y empieza a planificar tus mejores vuelos.</p>

            <!-- Formulario de Registro -->
            <form action="#" class="login-form">
                
                <!-- Campo: Nombre Completo -->
                <div class="input-group">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" placeholder="Tu nombre y apellido" required>
                </div>

                <!-- Campo: Correo -->
                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="ejemplo@correo.com" required>
                </div>

                <!-- Campo: Contraseña -->
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Crea una contraseña segura" required>
                </div>

                <!-- Campo: Confirmar Contraseña -->
                <div class="input-group">
                    <label for="confirm-password">Confirmar Contraseña</label>
                    <input type="password" id="confirm-password" placeholder="Repite tu contraseña" required>
                </div>

                <!-- Términos y Condiciones -->
                <div class="form-options">
                    <!-- AQUÍ APLICAMOS LA CLASE terminos-texto -->
                    <label class="remember-me terminos-texto">
                        <input type="checkbox" required> 
                        Acepto los <a href="#" class="forgot-password">Términos y Condiciones</a>
                    </label>
                </div>

                <!-- Botón de Registro -->
                <button type="submit" class="btn-crear btn-full">Crear cuenta</button>
            </form>

            <!-- Enlace para volver al Login -->
            <p class="register-link">
                ¿Ya tienes una cuenta? <a href="sesion.html">Inicia sesión</a>
            </p>

        </div>
    </div>

</body>
</html>
